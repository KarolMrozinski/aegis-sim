[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sim"
version = "0.1.0"
description = "C5ISR Strategy & Predictive Scenario Simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "duckdb>=0.9.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
aegis-sim = "aegis_sim.main:app"

[tool.setuptools.packages.find]
where = ["src"]